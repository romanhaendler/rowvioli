[project]
name = "rowvioli"
version = "0.2.0"
description = "Mirrors tables from source systems into PostgreSQL, as fresh as each table's maximum age"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pyarrow", "adbc-driver-postgresql", "pynacl"]

[project.optional-dependencies]
file = ["duckdb"]
odbc = ["arrow-odbc"]
rest = ["httpx"]

[project.scripts]
rowvioli = "rowvioli.cli:main"

[dependency-groups]
dev = ["pytest", "psycopg[binary]", "rowvioli[file,odbc,rest]", "rowvioli-testing"]

[tool.uv.sources]
rowvioli-testing = { path = "tests/connector", editable = true }

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.entry-points."rowvioli.connectors"]
postgres = "rowvioli.connectors.postgres"
file = "rowvioli.connectors.file"
odbc = "rowvioli.connectors.odbc"
rest = "rowvioli.connectors.rest"
