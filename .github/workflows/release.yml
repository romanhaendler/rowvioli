name: release

# a tag v* publishes to PyPI through trusted publishing; PyPI must name this repo, workflow and environment
on:
  push:
    tags: ["v*"]

jobs:
  # nothing is published unless the tests pass
  tests:
    uses: ./.github/workflows/tests.yml

  pypi:
    needs: tests
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # the tag must name the version that is built
      - run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
