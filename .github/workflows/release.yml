# A version is released by raising it in pyproject.toml. On each push to main
# the version is published when PyPI does not have it yet; the tag v<version>
# is set afterwards and triggers nothing. No token: PyPI trusts this workflow,
# environment and repository through trusted publishing.
#
# The rule: the job with the right to publish runs no foreign code. `build`
# runs the build backend but cannot mint a token; `pypi` holds the right and
# only downloads what `build` made and hands it to PyPI.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Outside the environment, so a push that releases nothing waits for no one.
  find:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.find.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        # 200: PyPI has the version. 404: it does not. Anything else is not guessed.
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/rowvioli/$version/json")"
          case "$code" in
            200) echo "rowvioli $version is on PyPI - nothing to publish"; echo "version=" >> "$GITHUB_OUTPUT" ;;
            404) echo "rowvioli $version is not on PyPI - publishing"; echo "version=$version" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::PyPI answered $code for rowvioli $version"; exit 1 ;;
          esac

  # Nothing is published unless the tests pass.
  tests:
    needs: find
    if: needs.find.outputs.version != ''
    uses: ./.github/workflows/tests.yml

  # No token and outside the environment: the build backend runs here.
  build:
    needs: [find, tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Holds the right to publish: installs nothing and builds nothing.
  pypi:
    needs: [find, build]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Only after PyPI has the version; the tag is a record and triggers nothing.
  tag:
    needs: [find, pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.find.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION exists already"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"
          fi
